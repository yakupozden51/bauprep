<!DOCTYPE html>
<html lang="tr" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B2 Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: institutional and exact, like a university language school's own study portal
   IDEA: the module's assessment calendar — a timetable of exams you work through in order
   PICTURE: home = the module timeline (PT1 → PT2 → PT3 → EOM → Proficiency); pack = the live study card / exam sheet
   COLOUR+TYPE: white paper, ink #0e1116, school cobalt #2340d8, marking green/red only for answers; Newsreader 600 headings, Inter text, IBM Plex Sans Arabic
   LAYOUT: hairline header, 1120px frame, timeline band, pack page with breadcrumb, facts rule, progress panel, underline tabs */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1115);--ink:light-dark(#0e1116,#eceef2);--mut:light-dark(#5b6170,#9aa1ad);--line:light-dark(#e3e5ea,#262a33);--card:light-dark(#f5f6f8,#171a20);--pri:light-dark(#2340d8,#7d93ff);--prib:light-dark(#eef1fd,#1a2040);--onpri:light-dark(#fff,#0f1115);--ok:light-dark(#157347,#4cc38a);--okbg:light-dark(#e9f6ef,#13291e);--bad:light-dark(#c8321f,#ff6b57);--badbg:light-dark(#fcecea,#331a17)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:clip;font-feature-settings:"tnum" 1,"cv11" 1}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic",Inter,system-ui,sans-serif}
.en{font-family:Inter,system-ui,sans-serif}
.frame{max-width:1120px;margin:0 auto;padding-inline:max(4vw,16px)}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
[dir=rtl] :is(h1,h2,h3){font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:700;letter-spacing:0}
h1{font-size:clamp(34px,5.4vw,52px);line-height:1.05;text-wrap:balance}
h2{font-size:clamp(24px,3.2vw,30px);line-height:1.15}
h3{font-size:19px;line-height:1.25}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
/* header */
.top{border-bottom:1px solid var(--line);background:var(--bg)}
.top .frame{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap}
.mark{text-align:start;display:flex;align-items:center;gap:10px;margin-inline-end:auto;text-decoration:none;color:inherit;border:0;background:none;padding:0}
.mark b{font:600 22px/1 Newsreader,Georgia,serif}
.mark small{display:block;font:500 12px/1 Inter,sans-serif;color:var(--mut);margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:6px;padding:6px 12px;min-height:36px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
/* home */
.intro{padding:clamp(36px,6vw,72px) 0 28px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end}
.eyebrow{color:var(--pri);font-weight:600;font-size:14px;margin-bottom:12px}
.lead{color:var(--mut);font-size:18px;margin:14px 0 0;max-width:60ch}
.intro .side{color:var(--mut);font-size:15px;border-inline-start:2px solid var(--pri);padding-inline-start:16px}
.intro .side b{color:var(--ink);display:block;font-size:15px}
.tl{list-style:none;margin:0 0 8px;padding:28px 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;position:relative}
.tl::before{content:"";position:absolute;top:39px;inset-inline:0;height:2px;background:var(--line)}
.tl li{position:relative;padding-inline-end:14px}
.tl .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--bg);position:relative;z-index:1;display:grid;place-items:center}
.tl li.on .dot{border-color:var(--pri);background:var(--pri)}
.tl li.on .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--onpri)}
.tl .st{display:block;margin-top:14px;font-size:12px;font-weight:600;color:var(--mut)}
.tl li.on .st{color:var(--pri)}
.tl .nm{display:block;font:600 22px/1.15 Newsreader,Georgia,serif;margin-top:4px}
[dir=rtl] .tl .nm{font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:700;font-size:20px}
.tl .ty{display:block;font-size:14px;color:var(--mut);margin-top:2px}
.tl .sc{display:block;font-size:14px;margin-top:10px;color:var(--ink)}
.tl a,.tl .ghost{display:inline-flex;align-items:center;margin-top:14px;min-height:40px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none}
.tl a{background:var(--pri);color:var(--onpri)}
.tl .ghost{border:1px dashed var(--line);color:var(--mut)}
.feat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);margin-top:48px}
.feat div{padding:22px 20px 26px 0}
[dir=rtl] .feat div{padding:22px 0 26px 20px}
.feat b{display:block;font-weight:600;margin-bottom:4px}
.feat span{color:var(--mut);font-size:15px}
.feat i{display:block;font:600 13px/1 Inter,sans-serif;font-style:normal;color:var(--pri);margin-bottom:12px}
.sets{margin-top:44px}
.setgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.setc{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:12px;padding:18px;text-decoration:none;color:inherit;transition:border-color .15s}
.setc:hover{border-color:var(--pri)}
.setc .ty{font-size:12px;font-weight:600;color:var(--pri)}
.setc .nm{font:600 21px/1.2 Newsreader,Georgia,serif}
[dir=rtl] .setc .nm{font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:700}
.setc .ds{font-size:14px;color:var(--mut)}
.setc .go{margin-top:10px;font-size:14px;font-weight:600;color:var(--pri)}
/* pack */
.crumb{padding:22px 0 0;font-size:14px;color:var(--mut)}
.crumb button{border:0;background:none;padding:0;color:var(--pri);font-weight:600;min-height:32px}
.phead{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:36px;padding:14px 0 26px;align-items:start}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--ink);margin-top:22px}
.facts div{padding:12px 14px 12px 0}
[dir=rtl] .facts div{padding:12px 0 12px 14px}
.facts b{display:block;font:600 28px/1.1 Newsreader,Georgia,serif}
.facts span{font-size:13px;color:var(--mut)}
.scope{margin-top:16px;font-size:15px}
.scope div{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.scope dt{font-weight:600}
.prog{background:var(--card);border-radius:12px;padding:20px}
.prog h3{font-size:17px;margin-bottom:12px}
.mrow{display:grid;grid-template-columns:minmax(8.5em,auto) minmax(0,1fr) 3.2em;white-space:nowrap;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.mrow .tr{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.mrow .tr i{display:block;height:100%;background:var(--pri)}
.mrow b{text-align:end;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.kpis b{display:block;font:600 24px/1.1 Newsreader,Georgia,serif}
.kpis span{font-size:12.5px;color:var(--mut)}
.tabs{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .frame{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:0;background:none;padding:0 14px;min-height:50px;font-weight:600;font-size:15px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--pri)}
.tabs button .n{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;line-height:20px}
.pane{padding:26px 0 56px;max-width:820px}
.pane.wide{max-width:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;min-height:38px;font-size:14px;font-weight:500}
.chips button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 16px;min-height:44px;font-weight:600;font-size:15px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.muted{color:var(--mut);font-size:14px}
.end{margin-inline-start:auto}
/* flashcard */
.thin{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:14px}
.thin i{display:block;height:100%;background:var(--pri);transition:width .25s}
.fc{border:1px solid var(--line);border-radius:14px;padding:30px 28px 46px;min-height:320px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;position:relative;background:var(--bg);box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(14,17,22,.25)}
.fc .w{font:600 clamp(36px,8vw,56px)/1.02 Newsreader,Georgia,serif}
.fc .pos{color:var(--mut);font-size:14px;margin-top:8px}
.fc .m{font-weight:600;font-size:22px;margin-top:14px;color:var(--pri)}
.fc .def{margin-top:4px;color:var(--mut)}
.fc .ex{margin-top:14px;font-family:Newsreader,Georgia,serif;font-size:19px;font-style:italic}
.fc .frm{margin-top:12px;font-size:14px;color:var(--mut)}
.fc .foot{position:absolute;bottom:14px;inset-inline:28px;display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.fc .known{color:var(--ok);font-weight:600}
/* word list */
.search{width:100%;max-width:420px;border:1px solid var(--line);border-radius:8px;padding:0 14px;min-height:46px;font-size:16px;background:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-size:13px;color:var(--mut);font-weight:600;text-align:start;padding:10px 10px 10px 0;border-bottom:1px solid var(--ink)}
td{padding:12px 10px 12px 0;border-bottom:1px solid var(--line);vertical-align:top;text-align:start}
td .wd{font-weight:600}
td .ps{display:block;font-size:12.5px;color:var(--mut)}
td .ex{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:16px}
.say{border:1px solid var(--line);background:var(--bg);border-radius:6px;width:30px;height:30px;padding:0;display:inline-grid;place-items:center;vertical-align:middle;margin-inline-start:6px}
.say svg{width:14px;height:14px}
/* questions */
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut);margin-bottom:10px;flex-wrap:wrap}
.qhead b{color:var(--ink);font-weight:600}
.stem{font:500 21px/1.45 Newsreader,Georgia,serif;margin:0 0 16px}
.stem u{text-decoration:none;display:inline-block;min-width:80px;border-bottom:1.5px solid var(--ink);margin:0 4px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;margin:8px 0;min-height:50px;font-size:16px;transition:border-color .15s}
.opt:hover{border-color:var(--mut)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--mut)}
.opt.sel{border-color:var(--pri);background:var(--prib)}
.opt.sel .k{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.verdict{display:flex;align-items:baseline;gap:10px;margin:20px 0 6px;font-weight:700;font-size:17px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.full{font-size:15px;color:var(--mut)}
.full b{color:var(--ink);font-weight:600}
.why{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.why li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.why li .ic{font-weight:700;color:var(--bad)}
.why li.ok .ic{color:var(--ok)}
.why li.mine{background:linear-gradient(90deg,var(--badbg),transparent 70%)}
[dir=rtl] .why li.mine{background:linear-gradient(-90deg,var(--badbg),transparent 70%)}
.why .s{color:var(--mut);font-size:14px}
.kbd{font-size:12.5px;color:var(--mut);margin-top:10px}
.kbd kbd{font:600 12px Inter,sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px}
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding:6px 0 18px;border-bottom:1px solid var(--line)}
.score{font:600 clamp(72px,16vw,112px)/.9 Newsreader,Georgia,serif;color:var(--pri)}
.result p{margin:6px 0 0;color:var(--mut)}
.rev{margin-top:10px}
.rev details{border-bottom:1px solid var(--line);padding:12px 0}
.rev summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.rev summary::-webkit-details-marker{display:none}
.rev summary .ic{font-weight:700;color:var(--bad)}
.rev details.ok summary .ic{color:var(--ok)}
.rev .ans{font-size:14px;color:var(--mut);margin-top:2px}
.rev .ans b{color:var(--ink)}
.rev .body{padding:6px 0 0 36px}
[dir=rtl] .rev .body{padding:6px 36px 0 0}
/* exam */
.exbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:18px;position:sticky;top:58px;background:var(--bg);z-index:4}
.timer{font:600 26px/1 Newsreader,Georgia,serif}
.timer.low{color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px;margin:0 0 18px}
.pal button{border:1px solid var(--line);background:var(--bg);border-radius:6px;min-height:34px;font-size:13px;font-weight:600;padding:0}
.pal button.a{background:var(--prib);border-color:var(--pri);color:var(--pri)}
.pal button.c{outline:2px solid var(--ink);outline-offset:1px}
.confirm{border:1px solid var(--bad);background:var(--badbg);border-radius:10px;padding:14px;margin-top:14px}
.examstart{border:1px solid var(--line);border-radius:14px;padding:26px}
.examstart ul{padding-inline-start:20px;color:var(--mut);margin:12px 0 18px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:30px;color:var(--mut);text-align:center}
.mlist{border-top:1px solid var(--line);margin-top:16px}
.mlist div{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.mlist .s{color:var(--mut);font-size:13px}
/* grammar */
.gram h3{margin:28px 0 8px}
.gram p{margin:6px 0}
.gram table{margin-top:6px}
.ex1{display:block;margin:6px 0;padding:4px 12px;border-inline-start:2px solid var(--line);font-family:Newsreader,Georgia,serif;font-size:17px;text-align:left}
.ex1.y{border-color:var(--ok)}.ex1.n{border-color:var(--bad);text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:1px}
footer{border-top:1px solid var(--line);color:var(--mut);font-size:13.5px}
footer .frame{padding-block:22px 40px;display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap}
[hidden]{display:none!important}
@media(max-width:900px){.setgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.intro,.phead{grid-template-columns:minmax(0,1fr);gap:22px}.feat{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){
.tl{grid-template-columns:minmax(0,1fr);padding-top:8px}.tl::before{top:8px;bottom:8px;inset-inline-start:11px;inset-inline-end:auto;width:2px;height:auto}
.tl li{display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:16px;padding:0 0 26px}.tl li>*:not(.dot){grid-column:2}.tl .dot{grid-row:1/span 6}.tl .st{margin-top:2px}
.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.facts div:nth-child(n+3){border-top:1px solid var(--line)}
.pal{grid-template-columns:repeat(9,minmax(0,1fr))}.exbar{top:50px}
.result{grid-template-columns:minmax(0,1fr);gap:8px}
table.stack thead{display:none}table.stack tr{display:grid;padding:12px 0;border-bottom:1px solid var(--line)}table.stack td{border:0;padding:2px 0}
}
@media(max-width:520px){.setgrid{grid-template-columns:minmax(0,1fr)}.feat{grid-template-columns:minmax(0,1fr)}.fc{padding:24px 20px 46px}.fc .foot{inset-inline:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header class="top"><div class="frame">
<button class="mark" id="home-link" aria-label="B2 Prep"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M8 21.5V10.5h5.2c2.3 0 3.6 1.1 3.6 2.8 0 1.2-.7 2-1.7 2.3 1.3.3 2.1 1.2 2.1 2.6 0 2-1.5 3.3-4 3.3H8zm2.6-6.6h2.3c1 0 1.6-.5 1.6-1.3 0-.8-.6-1.3-1.6-1.3h-2.3v2.6zm0 4.6h2.6c1.1 0 1.7-.5 1.7-1.4s-.6-1.4-1.7-1.4h-2.6v2.8z" fill="var(--bg)"/><rect x="19.5" y="18.6" width="4.5" height="2.9" rx="1" fill="#2340d8"/></svg><span><b>B2 Prep</b><small id="tagline"></small></span></button>
<div class="seg" id="lang" role="group" aria-label="Language"><button data-l="tr">TR</button><button data-l="en">EN</button><button data-l="ar" lang="ar">العربية</button></div>
</div></header>

<main id="home" hidden>
<section class="frame">
<div class="intro"><div><div class="eyebrow" id="h-kick"></div><h1 id="h-h1"></h1><p class="lead" id="h-lead"></p></div><div class="side" id="h-side"></div></div>
<h2 id="h-tl" style="font-size:20px;margin-top:10px"></h2>
<ol class="tl" id="tl"></ol>
<div class="sets"><h2 id="h-sets" style="font-size:20px"></h2><p class="muted" id="h-setsl" style="margin:4px 0 0"></p><div class="setgrid" id="sets"></div></div>
<div class="feat" id="feat"></div>
</section>
</main>

<main id="packv" hidden>
<div class="frame">
<div class="crumb" id="crumb"></div>
<div class="phead"><div><div class="eyebrow" id="kick"></div><h1 id="h1"></h1><p class="lead" id="lead"></p><div class="facts" id="facts"></div><dl class="scope" id="scope"></dl></div><aside class="prog" id="prog"></aside></div>
</div>
<nav class="tabs"><div class="frame" role="tablist" id="tabs"></div></nav>
<div class="frame">
<section class="pane" id="p-cards"><div class="chips" id="cf"></div><div class="thin"><i id="cbar"></i></div><div class="fc" id="card" tabindex="0" role="button"></div>
<div class="row"><button class="btn" id="prev"></button><button class="btn" id="flip"></button><button class="btn pri" id="next"></button><span class="muted end" id="cc"></span></div>
<div class="row"><button class="btn" id="shuf"></button><button class="btn" id="know"></button><button class="btn" id="sayc" hidden></button></div>
<p class="kbd" id="kbd1"></p></section>
<section class="pane wide" id="p-list" hidden><div class="row" style="margin:0 0 14px"><input class="search" id="q" type="search"><span class="muted" id="lc"></span></div><div class="chips" id="lf"></div><table class="stack" id="wl"></table></section>
<section class="pane" id="p-practice" hidden><div class="chips" id="tf"></div><div id="qa"></div><p class="kbd" id="kbd2"></p></section>
<section class="pane" id="p-exam" hidden><div id="ex"></div></section>
<section class="pane gram" id="p-gram" hidden></section>
<section class="pane" id="p-mist" hidden><div id="mb"></div></section>
</div>
</main>
<footer><div class="frame"><span id="foot"></span><span id="foot2"></span></div></footer>
<script>
{

<h3>2. الجملة غير التعريفية (بين فاصلتين)</h3><p>تضيف معلومة إضافية. <b>فاصلتان إلزاميتان</b>، <b>لا تُستخدم ${E('that')}</b>، ولا يُحذف الضمير.</p>${X('y','My father, who is a teacher, loves football.')}${X('n','My father, that is a teacher, loves football.')}<p>الفرق في المعنى: بدون فواصل = لدي أكثر من أخت؛ مع الفواصل = لدي أخت واحدة فقط.</p>
<h3>3. حذف الضمير</h3><p>فقط في الجملة <b>التعريفية</b> وعندما يكون الضمير <b>مفعولًا</b>. الاختبار: إذا جاء بعده مباشرة فاعل (I, he, the coach…) يمكن حذفه.</p>${X('y','The book (that) I bought is great.')}${X('n','The woman called you is here.')}${X('y','The woman who called you is here.')}
<h3>4. ‏which للإشارة إلى موقف كامل</h3><p>فاصلة + ${E('<b>which</b>')} تشير إلى الجملة السابقة كلها، ولا يصح ${E('that')} أو ${E('what')}.</p>${X('y','He passed the exam, which surprised everyone.')}${X('n','He passed the exam, what surprised everyone.')}
<h3>5. أخطاء شائعة</h3><p><b>where أم which؟</b> إذا نقص الجملةَ مفعولٌ أو فاعل نستخدم which، وإذا كانت مكتملة نستخدم where.</p>${X('y','the city which I visited · the city where I live')}${X('n','The hotel where we stayed in was lovely.')}<p><b>لا تأتي that بعد حرف جر:</b></p>${X('y','the house in which I grew up')}${X('n','the house in that I grew up')}<p>${E('everything / all / nothing + that')} و ${E('the reason + why')}. لا يجوز تكرار الفاعل:</p>${X('n','the man who he lives here')}`

/* ---------- flashcards ---------- */
let known=new Set(),cf='all',deck=[],ci=0,flipped=false;
function chipList(cur){return [['all',t('all')],...Object.keys(CHN).map(c=>[c,`${c} · ${CHN[c]}`]),['learn',t('learn')]].map(([k,l])=>`<button class="${k===cur?'on':''}" data-c="${k}" ${k.startsWith('U')?'dir="ltr"':''}>${l}</button>`).join('')}
function buildDeck(){deck=V.filter(v=>cf==='all'||(cf==='learn'?!known.has(v.w):v.ch===cf));ci=0;flipped=false;renderCard()}
function renderCF(){$('#cf').innerHTML=chipList(cf)}
$('#cf').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cf=b.dataset.c;renderCF();buildDeck()});
function renderCard(){const c=$('#card');
['prev','flip','next','shuf'].forEach(id=>$('#'+id).textContent=t(id));$('#card').setAttribute('aria-label',t('flipLabel'));$('#kbd1').innerHTML=t('kbd1');
$('#sayc').hidden=!canSay;$('#sayc').innerHTML=SPK+t('say');
if(!deck.length){c.innerHTML=`<div class="m" style="color:var(--mut)">${t('done')}</div>`;$('#cc').textContent='';$('#cbar').style.width='100%';$('#know').textContent=t('know');return}
const v=deck[ci];$('#cc').textContent=`${ci+1} / ${deck.length}`;$('#cbar').style.width=((ci+1)/deck.length*100)+'%';
$('#know').textContent=known.has(v.w)?t('unknow'):t('know');
const foot=`<div class="foot"><span dir="ltr">${v.ch} · ${CHN[v.ch]}</span><span class="${known.has(v.w)?'known':''}">${known.has(v.w)?t('knownMark'):flipped?'':t('tap')}</span></div>`;
c.innerHTML=flipped?`<div class="w" dir="ltr">${esc(v.w)}</div><div class="m">${lang==='tr'?esc(v.tr):lang==='ar'?esc(v.ar):esc(v.en)}</div>${lang!=='en'?`<div class="def" dir="ltr">${esc(v.en)}</div>`:''}<div class="ex" dir="ltr">${esc(v.ex.replace('___',v.ans))}</div>${v.frm?`<div class="frm">${t('forms')}: <span dir="ltr">${esc(v.frm)}</span></div>`:''}${foot}`
:`<div class="w" dir="ltr">${esc(v.w)}</div><div class="pos">${pc(v.pos)}</div>${foot}`}
const flip=()=>{flipped=!flipped;renderCard()};
const mv=d=>{if(!deck.length)return;ci=(ci+d+deck.length)%deck.length;flipped=false;renderCard()};
const toggleKnow=()=>{if(!deck.length)return;const w=deck[ci].w;known.has(w)?known.delete(w):known.add(w);st.set(pk('pp_known'),[...known]);
if(cf==='learn'){deck=deck.filter(v=>!known.has(v.w));if(ci>=deck.length)ci=0}else ci=(ci+1)%deck.length;flipped=false;renderCard();renderProg()};
$('#card').addEventListener('click',flip);$('#flip').addEventListener('click',flip);
$('#next').addEventListener('click',()=>mv(1));$('#prev').addEventListener('click',()=>mv(-1));
$('#shuf').addEventListener('click',()=>{deck=shuffle(deck);ci=0;flipped=false;renderCard()});
$('#know').addEventListener('click',toggleKnow);$('#sayc').addEventListener('click',()=>{if(deck.length)say(deck[ci].w)});

/* ---------- question builders (every option carries its own explanation) ---------- */
const GRP=[['nervous','tense','uneasy','uncertain','alert'],['recall','retain','store'],['alter','transform','enhance'],['occasion','incident','phenomenon'],['spectator','opponent'],['genuine','devoted','subjective','faulty'],['considerably','highly','relatively','increasingly'],['widespread','annual'],['detect','determine','classify'],['hazard','concern'],['distressing','overwhelming','adverse'],['admit','insist'],['peak','extent'],['loyalty','sense'],['treatment','medication','care','meditation'],['existence','evolution'],['hate speech','bullying'],['disinformation','misleading'],['protest','speak out','disapprove','riot'],['election','vote'],['prohibit','oppress']];
const near=(a,b)=>a===b||GRP.some(g=>g.includes(a)&&g.includes(b));
function qV(v){const pool=V.filter(x=>!near(x.w,v.w)&&x.pos===v.pos);const d=shuffle(pool.length>=3?pool:V.filter(x=>!near(x.w,v.w))).slice(0,3);
const opts=shuffle([v,...d]).map(o=>({txt:o.w,ok:o===v,why:()=>o===v
?`<b dir="ltr">${esc(o.w)}</b> (${pc(o.pos)}) ${t('means')}: ${mean(o)}`
:`<b dir="ltr">${esc(o.w)}</b> (${pc(o.pos)}) ${t('means')}: ${mean(o)} → ${t('nofit')}${o.pos!==v.pos?` ${t('needs')} ${pc(v.pos)}.`:''}`}));
return{id:'V:'+v.w,tag:'tagV',sub:`${v.ch} ${CHN[v.ch]}`,stem:v.ex,opts,full:v.ex.replace('___',v.ans)}}
function qF(i){const[stem,need,clue,os]=F[i];
const opts=shuffle(os.map(([w,c],j)=>({txt:w,ok:j===0,why:()=>j===0
?`<b dir="ltr">${esc(w)}</b> = ${pc(c)}. ${t('signal')}: <span dir="ltr">${esc(clue)}</span>`
:`<b dir="ltr">${esc(w)}</b> = ${pc(c)}. ${t('needs')} ${pc(need)} (<span dir="ltr">${esc(clue)}</span>).`})));
return{id:'F:'+i,tag:'tagF',stem,opts,full:stem.replace('___',os[0][0])}}
function qL(i){const[stem,ok,ws,key]=L[i];
const ex=w=>{const v=VM[w];return v?`<b dir="ltr">${esc(w)}</b> ${t('means')}: ${mean(v)} → `:`<b dir="ltr">${esc(w)}</b> `};
const opts=shuffle([ok,...ws].map((w,j)=>({txt:w,ok:j===0,why:()=>j===0
?`<b dir="ltr">${esc(w)}</b>. ${t('rule')}: <span dir="ltr">${esc(key)}</span>`
:`${ex(w)}${VM[w]?t('nofit'):t('notHere')} ${t('rule')}: <span dir="ltr">${esc(key)}</span>`})));
return{id:'L:'+i,tag:'tagL',stem,opts,full:stem.includes('___')?stem.replace('___',ok):''}}
function qG(i){const[stem,os]=G[i];
const opts=shuffle(os.map(([w,r],j)=>({txt:w,ok:j===0,why:()=>`<b dir="ltr">${esc(w)}</b> — ${R[r][LI[lang]]}`})));
return{id:'G:'+i,tag:'tagG',stem,opts,full:stem.includes('___')&&!stem.includes('?')?stem.replace('___',os[0][0]):''}}
function fromId(id){const[k,r]=[id[0],id.slice(2)];if(k==='V')return VM[r]?qV(VM[r]):null;const i=+r;
return k==='F'&&F[i]?qF(i):k==='L'&&L[i]?qL(i):k==='G'&&G[i]?qG(i):null}
const mix=()=>G.length?shuffle([...idx(V,10).map(i=>qV(V[i])),...idx(F,4).map(qF),...idx(L,3).map(qL),...idx(G,8).map(qG)]):shuffle([...idx(V,11).map(i=>qV(V[i])),...idx(F,6).map(qF),...idx(L,8).map(qL)]);
const stemHTML=s=>esc(s).replace('___','<u></u>');
const optHTML=(q,cls)=>q.opts.map((o,i)=>`<button class="opt ${cls(o,i)}" data-i="${i}" dir="ltr"><span class="k">${'ABCD'[i]}</span><span>${esc(o.txt)}</span></button>`).join('');
function whyHTML(q,p){return `<ul class="why">${q.opts.map((o,i)=>`<li class="${o.ok?'ok':''} ${i===p&&!o.ok?'mine':''}"><span class="ic">${o.ok?'✓':'✗'}</span><span>${o.why()}</span></li>`).join('')}</ul>`}

/* ---------- mistake bank ---------- */
const mist=()=>P?st.get(pk('pp_mist'),[]):[];
const addMist=id=>{const m=mist();if(!m.includes(id)){m.push(id);st.set(pk('pp_mist'),m)}};
const delMist=id=>st.set(pk('pp_mist'),mist().filter(x=>x!==id));
function renderMist(){const m=mist();
if(!m.length){$('#mb').innerHTML=`<h2>${t('mH')}</h2><div class="empty" style="margin-top:16px">${t('mEmpty')}</div>`;return}
$('#mb').innerHTML=`<h2>${t('mH')}</h2><p class="muted">${m.length} ${t('mCount')} · ${t('mNote')}</p><div class="row"><button class="btn pri" id="mr">${t('mRetry')}</button><button class="btn" id="mc">${t('mClear')}</button></div>
<div class="mlist">${m.map(id=>{const q=fromId(id);return q?`<div><span class="s">${t(q.tag)}</span><div dir="ltr">${stemHTML(q.stem)}</div></div>`:''}).join('')}</div>`;
$('#mr').addEventListener('click',()=>{mode='mist';tab='practice';renderTabs();renderTF();makeSet()});
$('#mc').addEventListener('click',()=>{st.set(pk('pp_mist'),[]);renderMist();renderTabs()})}

/* ---------- practice ---------- */
let mode='mix',Q=[],qi=0,score=0,pick=-1,wr=[];
function makeSet(){
Q=mode==='vocab'?idx(V,25).map(i=>qV(V[i])):mode==='forms'?idx(F,25).map(qF):mode==='lex'?idx(L,25).map(qL):mode==='gram'?idx(G,25).map(qG):mode==='mist'?shuffle(mist()).map(fromId).filter(Boolean):mix();
qi=0;score=0;pick=-1;wr=[];renderQ()}
function renderTF(){const M={...t('modes')};if(!G.length)delete M.gram;if(mode==='mist')M.mist=t('mMode');
$('#tf').innerHTML=Object.entries(M).map(([k,l])=>`<button class="${k===mode?'on':''}" data-m="${k}">${l}</button>`).join('');$('#kbd2').innerHTML=t('kbd2')}
$('#tf').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;renderTF();makeSet()});
function renderQ(){
if(!Q.length){$('#qa').innerHTML=`<div class="empty">${t('mEmpty')}</div>`;return}
if(qi>=Q.length){const p=Math.round(score/Q.length*100);
if(mode!=='mist'){const b=st.get(pk('pp_best'),{});if(!b[mode]||p>b[mode]){b[mode]=p;st.set(pk('pp_best'),b)}}renderProg();renderTabs();
$('#qa').innerHTML=`<div class="result"><div class="score" dir="ltr">${p}%</div><div><h3>${t('res')}</h3><p><b dir="ltr">${score}/${Q.length}</b> ${t('cor')}. ${t('msg').find(m=>p>=m[0])[1]}</p><div class="row"><button class="btn pri" id="again">${t('again')}</button></div></div></div>${reviewHTML(wr.map(([q,i])=>[q,i]))}`;
$('#again').addEventListener('click',makeSet);return}
const q=Q[qi];
$('#qa').innerHTML=`<div class="thin"><i style="width:${qi/Q.length*100}%"></i></div><div class="qhead"><span>${t('q')} <b dir="ltr">${qi+1}/${Q.length}</b> · ${t(q.tag)}${q.sub?` · <span dir="ltr">${q.sub}</span>`:''}</span><span>${t('pts')} <b dir="ltr">${qi?Math.round(score/qi*100)+'%':'–'}</b></span></div>
<p class="stem" dir="ltr">${stemHTML(q.stem)}</p>${optHTML(q,(o,i)=>pick<0?'':o.ok?'ok':i===pick?'bad':'')}
${pick>=0?`<div class="verdict ${q.opts[pick].ok?'ok':'bad'}">${q.opts[pick].ok?t('ok'):t('bad')}</div>${q.full?`<div class="full">${t('full')}: <b dir="ltr">${esc(q.full)}</b></div>`:''}<h3 style="font-size:16px;margin:16px 0 0">${t('why')}</h3>${whyHTML(q,pick)}<div class="row"><button class="btn pri" id="nq">${qi+1<Q.length?t('nextq'):t('see')}</button></div>`:''}`;
$('#qa').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.i)));
const n=$('#nq');if(n)n.addEventListener('click',advance)}
function choose(i){if(pick>=0||qi>=Q.length)return;const q=Q[qi];pick=i;
if(q.opts[i].ok){score++;if(mode==='mist')delMist(q.id)}else{wr.push([q,i]);addMist(q.id)}renderQ();renderTabs();const n=$('#nq');if(n)n.focus({preventScroll:true})}
function advance(){qi++;pick=-1;renderQ();$('#p-practice').scrollIntoView({block:'start'})}
function reviewHTML(list){if(!list.length)return'';return `<div class="rev">${list.map(([q,p])=>{const c=q.opts.find(o=>o.ok),ok=p>=0&&q.opts[p].ok;
return `<details class="${ok?'ok':''}"><summary><span class="ic">${ok?'✓':'✗'}</span><span><span dir="ltr">${stemHTML(q.stem)}</span><div class="ans">${t('yours')}: <b dir="ltr">${p>=0?esc(q.opts[p].txt):t('none')}</b> · ${t('right')}: <b dir="ltr">${esc(c.txt)}</b></div></span></summary><div class="body">${whyHTML(q,p)}</div></details>`}).join('')}</div>`}

/* ---------- mock exam ---------- */
const DUR=30*60*1000;let EX=null,tick=null,askEnd=false;
function renderExam(){const x=$('#ex');
if(!EX){x.innerHTML=`<div class="examstart"><h2>${t('exH')}</h2><ul>${(G.length?t('exList'):[t('exV'),...t('exList').slice(1)]).map(l=>`<li>${l}</li>`).join('')}</ul><button class="btn pri" id="exs">${t('start')}</button></div>`;
$('#exs').addEventListener('click',()=>{EX={qs:mix(),a:Array(25).fill(-1),cur:0,end:Date.now()+DUR,done:false};askEnd=false;startTick();renderExam()});return}
if(EX.done){const c=EX.qs.filter((q,i)=>EX.a[i]>=0&&q.opts[EX.a[i]].ok).length,p=c*4;
x.innerHTML=`${EX.timeup?`<p class="confirm">${t('timeup')}</p>`:''}<div class="result"><div class="score" dir="ltr">${p}</div><div><h3>${t('res')} <span class="muted" dir="ltr">${t('outOf')}</span></h3><p><b dir="ltr">${c}/25</b> ${t('cor')}. ${t('msg').find(m=>p>=m[0])[1]}</p><div class="row"><button class="btn pri" id="exr">${t('again')}</button></div></div></div><h3 style="margin-top:22px">${t('key')}</h3>${reviewHTML(EX.qs.map((q,i)=>[q,EX.a[i]]))}`;
$('#exr').addEventListener('click',()=>{EX=null;renderExam()});return}
const q=EX.qs[EX.cur],an=EX.a.filter(v=>v>=0).length;
x.innerHTML=`<div class="exbar"><span class="muted">${t('left')}</span><span class="timer" id="tm" dir="ltr"></span><span class="muted">${t('answered')} <b dir="ltr" style="color:var(--ink)">${an}/25</b></span><button class="btn pri sm end" id="exf">${t('finish')}</button></div>
${askEnd?`<div class="confirm"><b dir="ltr">${25-an}</b> ${t('sure')}<div class="row"><button class="btn pri" id="ey">${t('yes')}</button><button class="btn" id="en">${t('no')}</button></div></div>`:''}
<div class="pal">${EX.qs.map((_,i)=>`<button class="${EX.a[i]>=0?'a':''} ${i===EX.cur?'c':''}" data-j="${i}" dir="ltr">${i+1}</button>`).join('')}</div>
<div class="qhead"><span>${t('q')} <b dir="ltr">${EX.cur+1}/25</b> · ${t(q.tag)}</span></div><p class="stem" dir="ltr">${stemHTML(q.stem)}</p>${optHTML(q,(o,i)=>EX.a[EX.cur]===i?'sel':'')}
<div class="row"><button class="btn" id="ep" ${EX.cur?'':'disabled'}>${t('prev')}</button><button class="btn pri" id="enx" ${EX.cur<24?'':'disabled'}>${t('next')}</button></div>`;
updTimer();
x.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{EX.a[EX.cur]=+b.dataset.i;renderExam()}));
x.querySelector('.pal').addEventListener('click',e=>{const b=e.target.closest('button');if(b){EX.cur=+b.dataset.j;renderExam()}});
$('#ep').addEventListener('click',()=>{EX.cur--;renderExam()});$('#enx').addEventListener('click',()=>{EX.cur++;renderExam()});
$('#exf').addEventListener('click',()=>{if(EX.a.includes(-1)){askEnd=true;renderExam()}else submit(false)});
if(askEnd){$('#ey').addEventListener('click',()=>submit(false));$('#en').addEventListener('click',()=>{askEnd=false;renderExam()})}}
function submit(timeup){if(!EX||EX.done)return;EX.done=true;EX.timeup=timeup;askEnd=false;clearInterval(tick);
const c=EX.qs.filter((q,i)=>EX.a[i]>=0&&q.opts[EX.a[i]].ok).length*4;if(c>st.get(pk('pp_bestE'),0))st.set(pk('pp_bestE'),c);
EX.qs.forEach((q,i)=>{if(!(EX.a[i]>=0&&q.opts[EX.a[i]].ok))addMist(q.id)});renderProg();renderTabs();renderExam();$('#p-exam').scrollIntoView({block:'start'})}
function updTimer(){const e=$('#tm');if(!e||!EX)return;const ms=Math.max(0,EX.end-Date.now()),m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);
e.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;e.classList.toggle('low',ms<5*60000)}
function startTick(){clearInterval(tick);tick=setInterval(()=>{if(!EX||EX.done)return clearInterval(tick);if(Date.now()>=EX.end)submit(true);else updTimer()},1000)}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{if(!P||e.target.matches('input,textarea')||e.metaKey||e.ctrlKey||e.altKey)return;
if(tab==='cards'){if(e.key===' '){e.preventDefault();flip()}else if(e.key==='ArrowRight')mv(lang==='ar'?-1:1);else if(e.key==='ArrowLeft')mv(lang==='ar'?1:-1);else if(e.key.toLowerCase()==='k')toggleKnow()}
else if(tab==='practice'){if(/^[1-4]$/.test(e.key))choose(+e.key-1);else if(e.key==='Enter'&&pick>=0){e.preventDefault();advance()}}
else if(tab==='exam'&&EX&&!EX.done&&/^[1-4]$/.test(e.key)){EX.a[EX.cur]=+e.key-1;renderExam()}});

/* ---------- language, routing, boot ---------- */
function renderAll(){
document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
$('#tagline').textContent=t('tagline');$('#foot').textContent=t('foot');$('#foot2').textContent=t('foot2');
$('#home').hidden=!!P;$('#packv').hidden=!P;
document.title=P?`${P.name[lang]} · B2 Prep`:'B2 Prep';
if(!P){renderHome();return}
renderPackHead();renderCF();renderCard();renderList();renderTF();renderQ();renderExam();renderMist();$('#p-gram').innerHTML=P.GRAM?P.GRAM[lang]:''}
$('#lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;st.set('pp_lang',lang);renderAll()});
$('#home-link').addEventListener('click',()=>{location.hash=''});
function route(){const p=PACKS.find(x=>x.id===location.hash.slice(1)&&!x.soon)||null;
if(p&&p!==P){P=p;({V,F,L,G}=p);CHN=p.chn;VM=Object.fromEntries(V.map(v=>[v.w,v]));known=new Set(st.get(pk('pp_known'),[]));cf='all';lf='all';lq='';mode='mix';EX=null;clearInterval(tick);buildDeck();makeSet()}
else if(!p)P=null;
renderAll();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
}
</script></body></html>
